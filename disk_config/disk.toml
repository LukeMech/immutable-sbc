# customizations.filesystem is rejected for "raw" ("not supported"); disk.partitions
# sizes raw partitions instead -- without it, root defaulted to ~8.5 GiB of headroom.
#
# "btrfs" is a partition *type* here, not fs_type (only xfs/ext4/vfat/swap) --
# it matches the in-image root filesystem declaration via a subvolume instead.
#
# minsize is a floor, not a cap -- osbuild sizes up to fit what's installed.
# Image is small on purpose; 00-default-config.sh's service grows it to fill the disk.
[[customizations.disk.partitions]]
type = "btrfs"
minsize = "1 GiB"

[[customizations.disk.partitions.subvolumes]]
name = "root"
mountpoint = "/"
