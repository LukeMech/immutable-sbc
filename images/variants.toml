# A variant (what build.yml matrixes over) bundles a board family's OS needs:
# images/<suffix>/{build_files,system_files}/, package "immutable-sbc-<suffix>".
#
# Not tied to one board -- boards.toml entries can share a variant.

[rk3588]
suffix = "rk3588"
description = "RK3588(S)-family boards: AIC8800 Wi-Fi/BT driver, mesa-libTeflon NPU delegate"

[rpi]
suffix = "rpi"
description = "Raspberry Pi boards -- Wi-Fi/BT and GPU are upstream, no NPU (CPU-only inference)"
