# Autologin the baked-in default account (see build_files/01-gnome-
# minimal.sh) -- there's no gnome-initial-setup wizard and no password
# to type at the GDM greeter either (the account is locked, see that
# same script), so this is what actually gets straight to the desktop.
[daemon]
AutomaticLoginEnable=True
AutomaticLogin=lm
