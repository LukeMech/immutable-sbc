# Same "us" layout as /etc/vconsole.conf, for Xwayland/mutter -- the
# format systemd-localed itself generates via `localectl set-x11-keymap`,
# shipped statically instead since there's no interactive install to run
# that command during.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "us"
EndSection
