# Makes every install path (bootc-image-builder, `bootc install`,
# `bootc switch`) record the deployment's origin as ostree-image-signed
# instead of ostree-unverified-registry, so policy.json's sigstoreSigned
# rule for ghcr.io/lukemech is actually consulted on future `bootc
# upgrade` / `rpm-ostree update`, not silently skipped.
#
# Requires policy.json's top-level "default" to be anything other than
# insecureAcceptAnything -- bootc refuses to honor this flag otherwise
# ("specifies a default of insecureAcceptAnything; refusing usage"),
# which is why that default is "reject" with per-registry overrides.
#
# https://bootc.dev/bootc/man/bootc-install-config.5.html
[install]
enforce-container-sigpolicy = true
