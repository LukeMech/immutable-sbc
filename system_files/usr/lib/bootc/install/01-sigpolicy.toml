# Makes every install path (bootc-image-builder disk images, `bootc
# install`, `bootc switch`) record the deployment's origin as
# ostree-image-signed instead of ostree-unverified-registry, so
# system_files/etc/containers/policy.json's sigstoreSigned rule for
# ghcr.io/lukemech is actually consulted on every future `bootc upgrade`
# / `rpm-ostree update`, not silently skipped.
#
# Requires policy.json's top-level "default" to be anything other than
# insecureAcceptAnything -- bootc refuses to honor this flag otherwise
# ("containers-policy.json specifies a default of `insecureAcceptAnything`;
# refusing usage"), which is why that default is "reject" with explicit
# per-registry overrides instead.
#
# https://bootc.dev/bootc/man/bootc-install-config.5.html
[install]
enforce-container-sigpolicy = true
