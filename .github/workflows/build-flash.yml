name: Build flash image

# Called via build.yml's `uses:` (tag from release-meta), or run directly from
# the Actions UI (no tag). event_name here is the caller's, never 'workflow_call'.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the built disk images to an existing release (leave unchecked for a manual test run)"
        type: boolean
        default: false
      tag:
        description: "Existing release tag to attach disk images to (required if publish is checked)"
        type: string
        default: ""
  workflow_call:
    inputs:
      publish:
        description: "Attach the built disk images to an existing release"
        type: boolean
        default: false
      tag:
        description: "Existing release tag to attach disk images to (required if publish is true)"
        type: string
        default: ""

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  # Not ${{ github.workflow }} -- a called workflow sees its caller's name
  # there, which would collide with build.yml's own group and cancel it.
  group: build-flash-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover boards
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.list.outputs.boards }}
    steps:
      # No ref: override needed -- default checkout already resolves to
      # the calling run's exact commit (or the dispatch's own ref).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Every top-level table in images/boards.toml IS a board -- adding
      # one is just adding a table there, no separate list to sync.
      - name: List boards
        id: list
        run: |
          set -euo pipefail
          boards=$(python3 -c '
          import json, tomllib
          with open("images/boards.toml", "rb") as f:
              data = tomllib.load(f)
          print(json.dumps(sorted(data.keys())))
          ')
          echo "Discovered boards: ${boards}"
          echo "boards=${boards}" >> "$GITHUB_OUTPUT"

  build:
    name: Build disk image (${{ matrix.board }})
    needs: discover
    strategy:
      matrix:
        board: ${{ fromJson(needs.discover.outputs.boards) }}
      fail-fast: false
    # aarch64-only: always a native arm64 runner. Pinned to 24.04, not 26.04 --
    # image-template#269 tracks a "mount: permission denied" osbuild failure there.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Install dependencies
        run: |
          set -x
          sudo apt-get update -y
          sudo apt-get install -y podman gdisk zstd

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Reads this board's [<board>] table from images/boards.toml so nothing here
      # hardcodes variant/disk/firmware -- add a board there, not in this workflow.
      - name: Load board config
        id: board-config
        run: |
          set -euo pipefail
          python3 - "${{ matrix.board }}" >> "$GITHUB_OUTPUT" <<'PY'
          import sys, tomllib
          board_name = sys.argv[1]
          with open("images/boards.toml", "rb") as f:
              data = tomllib.load(f)[board_name]
          print(f"variant={data['variant']}")
          print(f"disk_config={data['disk_config']}")
          has_firmware = "edk2_url" in data
          print(f"has_firmware={'true' if has_firmware else 'false'}")
          if has_firmware:
              print(f"firmware_url={data['edk2_url']}")
              print(f"firmware_sha256={data['edk2_sha256']}")
          PY

      - name: Prepare environment
        run: |
          IMAGE_NAME="immutable-sbc-${{ steps.board-config.outputs.variant }}"
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Build disk image
        id: build
        uses: osbuild/bootc-image-builder-action@b43efcb44d76d46d55022b66d3dbb89bdf6e5c9a # main
        with:
          config-file: ./${{ steps.board-config.outputs.disk_config }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          types: raw
          # Root filesystem type is declared in-image (00-root-filesystem.toml),
          # not here -- no --rootfs flag needed.
          additional-args: --use-librepo=True

      # Only boards declaring edk2_url need firmware. Local filename is arbitrary
      # (never inspected downstream) -- hardcoded rather than a boards.toml field.
      - name: Fetch board firmware
        if: steps.board-config.outputs.has_firmware == 'true'
        run: |
          ./scripts/fetch-firmware.sh \
            "${{ steps.board-config.outputs.firmware_url }}" \
            "${{ steps.board-config.outputs.firmware_sha256 }}" \
            firmware.img

      - name: Compose flashable image
        run: |
          set -euo pipefail
          OUTPUT_DIR="${{ steps.build.outputs.output-directory }}"
          OUT_NAME="immutable-sbc-${{ matrix.board }}"

          # Locate the raw disk wherever bootc-image-builder put it, rather than assume
          # a fixed subpath -- its output layout has changed between versions.
          RAW_IMAGE=$(find "${OUTPUT_DIR}" -iname '*.raw' -print -quit)
          if [[ -z "${RAW_IMAGE}" ]]; then
              echo "error: no .raw file found under ${OUTPUT_DIR}" >&2
              find "${OUTPUT_DIR}"
              exit 1
          fi
          echo "Found raw disk image: ${RAW_IMAGE}"
          RAW_DIR=$(dirname "${RAW_IMAGE}")
          # sudo: bootc-image-builder-action runs rootful, so the output dir comes out
          # root-owned -- without this, zstd's -o write below fails "Permission denied".
          sudo chown "$(id -u):$(id -g)" "${RAW_DIR}"

          if [[ "${{ steps.board-config.outputs.has_firmware }}" == "true" ]]; then
            ./scripts/compose-sdcard-image.sh \
              firmware.img \
              "${RAW_IMAGE}" \
              "${OUT_NAME}.raw"
            # sudo: root-owned output, same reason as above (confirmed
            # "Permission denied" otherwise).
            sudo rm -f "${RAW_IMAGE}"
          else
            # sudo mv: same root-owned-output reason as above.
            sudo mv "${RAW_IMAGE}" "${OUT_NAME}.raw"
            sudo chown "$(id -u):$(id -g)" "${OUT_NAME}.raw"
          fi

          zstd -T0 -12 --rm "${OUT_NAME}.raw" -o "${RAW_DIR}/${OUT_NAME}.img.zst"
          sha256sum "${RAW_DIR}/${OUT_NAME}.img.zst" > "${RAW_DIR}/${OUT_NAME}.img.zst.sha256"

      - name: Upload disk image and checksum to Job Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immutable-sbc-${{ matrix.board }}-raw
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

  # Runs once, after every board's build, attaching to the release
  # build.yml's release-meta job already published (never waits on this).
  attach-assets:
    name: Attach disk images to release
    needs: build
    if: inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download disk images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: immutable-sbc-*-raw
          path: artifacts
          merge-multiple: true

      # "build" names artifacts before inputs.tag is known, so the version is spliced
      # in here -- the .sha256 file's embedded filename is rewritten too, to match.
      - name: Add version to release asset filenames
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${TAG}" ]]; then
            echo "error: publish is true but no tag was given" >&2
            exit 1
          fi
          find artifacts -type f -name '*.img.zst' -print0 |
            while IFS= read -r -d '' f; do
              dir=$(dirname "${f}")
              base=$(basename "${f}" .img.zst)
              new="${dir}/${base}-${TAG}.img.zst"
              mv "${f}" "${new}"

              sha_file="${dir}/${base}.img.zst.sha256"
              if [[ -f "${sha_file}" ]]; then
                hash=$(awk '{print $1}' "${sha_file}")
                echo "${hash}  $(basename "${new}")" > "${dir}/${base}-${TAG}.img.zst.sha256"
                rm -f "${sha_file}"
              fi
            done

      # No tag_name/name/body -- only attaches files, doesn't touch the
      # release's identity or changelog.
      - name: Attach disk images to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          # ** because output is nested by type; fail_on_unmatched_files catches a glob
          # that stops matching (confirmed: a flat glob silently published nothing).
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.zst
            artifacts/**/*.sha256
