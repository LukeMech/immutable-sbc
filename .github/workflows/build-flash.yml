name: Build flash image

on:
  # Manual run: builds and uploads the flash images for inspection, but
  # never tags or publishes a release (see the release job's steps below,
  # each gated to only actually publish on the automatic workflow_run
  # path) -- a way to test the flash-composition pipeline on demand
  # without shipping anything.
  workflow_dispatch:
  # The only other trigger: chains off build.yml ("Build container
  # image") instead of a manually pushed tag -- every successful, non-PR
  # run there flows straight into building the flash images and
  # publishing a release, tagged automatically (see "Compute release
  # tag" below).
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover boards
    runs-on: ubuntu-latest
    # workflow_run fires for *every* completion of build.yml, including
    # its own PR runs and failures -- only a successful, non-PR run there
    # should ever flow into a release. Gated here (the root of the
    # dependency graph) rather than repeated on every downstream job.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    outputs:
      boards: ${{ steps.list.outputs.boards }}
    steps:
      # Pin to the exact commit build.yml just built, not whatever main
      # currently is -- a workflow_run event's default checkout ref is
      # this workflow *file's* current default-branch state, which could
      # already be ahead of it if something else landed on main in the
      # gap. workflow_dispatch already checks out the right ref on its
      # own, so this only takes effect for workflow_run.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Every top-level table in images/boards.toml IS a board -- no
      # separate list to keep in sync. Adding a board is just adding a
      # table there.
      - name: List boards
        id: list
        run: |
          set -euo pipefail
          boards=$(python3 -c '
          import json, tomllib
          with open("images/boards.toml", "rb") as f:
              data = tomllib.load(f)
          print(json.dumps(sorted(data.keys())))
          ')
          echo "Discovered boards: ${boards}"
          echo "boards=${boards}" >> "$GITHUB_OUTPUT"

  build:
    name: Build disk image (${{ matrix.board }})
    needs: discover
    strategy:
      matrix:
        board: ${{ fromJson(needs.discover.outputs.boards) }}
      fail-fast: false
    # aarch64-only project: always a native arm64 runner.
    # Pinned to 24.04 (not 26.04): ubuntu-os/image-template#269 tracks the
    # exact same "mount: ... permission denied" failure inside osbuild on
    # ubuntu-26.04(-arm) runners; 24.04 predates whatever regressed there.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Install dependencies
        run: |
          set -x
          sudo apt-get update -y
          sudo apt-get install -y podman gdisk zstd

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Reads this board's own [<board>] table from images/boards.toml so
      # the rest of this job never needs to hardcode this board's
      # variant, disk config, or firmware -- add a board by adding a
      # table there, not by editing this workflow.
      - name: Load board config
        id: board-config
        run: |
          set -euo pipefail
          python3 - "${{ matrix.board }}" >> "$GITHUB_OUTPUT" <<'PY'
          import sys, tomllib
          board_name = sys.argv[1]
          with open("images/boards.toml", "rb") as f:
              data = tomllib.load(f)[board_name]
          print(f"variant={data['variant']}")
          print(f"disk_config={data['disk_config']}")
          has_firmware = "edk2_url" in data
          print(f"has_firmware={'true' if has_firmware else 'false'}")
          if has_firmware:
              print(f"firmware_url={data['edk2_url']}")
              print(f"firmware_sha256={data['edk2_sha256']}")
          PY

      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          IMAGE_NAME="immutable-sbc-${{ steps.board-config.outputs.variant }}"
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Build disk image
        id: build
        uses: osbuild/bootc-image-builder-action@b43efcb44d76d46d55022b66d3dbb89bdf6e5c9a # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./${{ steps.board-config.outputs.disk_config }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: raw
          # Root filesystem type is declared in-image, shared by every
          # variant (system_files/usr/lib/bootc/install/00-root-filesystem.toml),
          # not here -- no --rootfs flag needed.
          additional-args: --use-librepo=True

      # Not every board needs firmware embedded on the disk -- only ones
      # that declare edk2_url (and friends) in their images/boards.toml table.
      # The local filename is arbitrary (fetch-firmware.sh/compose-sdcard-
      # image.sh never inspect it) -- hardcoded here instead of another
      # images/boards.toml field.
      - name: Fetch board firmware
        if: steps.board-config.outputs.has_firmware == 'true'
        run: |
          ./scripts/fetch-firmware.sh \
            "${{ steps.board-config.outputs.firmware_url }}" \
            "${{ steps.board-config.outputs.firmware_sha256 }}" \
            firmware.img

      - name: Compose flashable image
        run: |
          set -euo pipefail
          OUTPUT_DIR="${{ steps.build.outputs.output-directory }}"
          OUT_NAME="immutable-sbc-${{ matrix.board }}"

          # Locate the raw disk wherever bootc-image-builder actually put
          # it, rather than assuming a fixed subpath -- its output layout
          # has changed between versions.
          RAW_IMAGE=$(find "${OUTPUT_DIR}" -iname '*.raw' -print -quit)
          if [[ -z "${RAW_IMAGE}" ]]; then
              echo "error: no .raw file found under ${OUTPUT_DIR}" >&2
              find "${OUTPUT_DIR}"
              exit 1
          fi
          echo "Found raw disk image: ${RAW_IMAGE}"
          RAW_DIR=$(dirname "${RAW_IMAGE}")

          if [[ "${{ steps.board-config.outputs.has_firmware }}" == "true" ]]; then
            ./scripts/compose-sdcard-image.sh \
              firmware.img \
              "${RAW_IMAGE}" \
              "${OUT_NAME}.raw"
            rm -f "${RAW_IMAGE}"
          else
            mv "${RAW_IMAGE}" "${OUT_NAME}.raw"
          fi

          zstd -T0 -12 --rm "${OUT_NAME}.raw" -o "${RAW_DIR}/${OUT_NAME}.img.zst"
          sha256sum "${RAW_DIR}/${OUT_NAME}.img.zst" > "${RAW_DIR}/${OUT_NAME}.img.zst.sha256"

      - name: Upload disk image and checksum to Job Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immutable-sbc-${{ matrix.board }}-raw
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

  # Runs once, after every board in the matrix above has finished, instead
  # of duplicating release publish/attach in each matrix job -- avoids the
  # race that used to exist here: with more than one board sharing a
  # single v-tag release, each matrix job ran "Publish release" against
  # the *same* tag_name concurrently, and while softprops/action-gh-release
  # get-or-creating the release then uploading that job's files is safe
  # for asset uploads, the release body (whichever board's changelog) came
  # from whichever job's call landed last.
  release:
    name: Publish release
    needs: [discover, build]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
      packages: read

    steps:
      # fetch-depth: 0 + fetch-tags -- the changelog/prev-release steps
      # below need full history and every v-tag to find the previous
      # release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download disk images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: immutable-sbc-*-raw
          path: artifacts
          merge-multiple: true

      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}

      # No more manually-pushed vX.Y.Z tag to read a name from -- derive
      # one from the Fedora version this image is actually built on
      # (Containerfile's own fedora-bootc FROM line, so it never drifts
      # out of sync with a hardcoded number), today's date, and a 2-digit
      # counter that starts at 01 and bumps once per existing same-day tag
      # -- so more than one release landing on the same calendar date
      # (e.g. build.yml's push trigger firing more than once today) gets
      # v44.20260919-01, -02, ... instead of colliding or being skipped.
      - name: Compute release tag
        id: release-tag
        run: |
          set -euo pipefail
          FEDORA_VER=$(awk -F'[:@]' '/^FROM quay.io\/fedora\/fedora-bootc:/ {print $2; exit}' Containerfile)
          if [[ -z "${FEDORA_VER}" ]]; then
            echo "error: couldn't read the Fedora version from Containerfile's fedora-bootc FROM line" >&2
            exit 1
          fi
          PREFIX="v${FEDORA_VER}.$(date -u +%Y%m%d)"
          # 10#: force base-10 so a prior "08"/"09" isn't parsed as an
          # invalid octal literal by bash arithmetic below.
          LAST_NUM=$(git tag -l "${PREFIX}-*" | sed -E "s/^${PREFIX}-//" | sort -n | tail -1)
          NEXT_NUM=$(( 10#${LAST_NUM:-0} + 1 ))
          TAG="$(printf '%s-%02d' "${PREFIX}" "${NEXT_NUM}")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Publishing (tag + GitHub Release) only ever happens on the
      # automatic path chained from build.yml -- a direct workflow_dispatch
      # still builds and uploads the flash images above (for on-demand
      # testing of the flash-composition pipeline) but stops here.
      - name: Login to GitHub Container Registry
        if: github.event_name == 'workflow_run'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Finds the previous release's git tag so the changelog below can
      # diff against the exact commit that shipped, not whatever :latest
      # happens to point at right now. No self-exclusion needed here --
      # unlike the old manually-pushed-tag model, this run's own release
      # tag doesn't exist yet at this point (created in "Create release
      # tag" below), so it can't show up in this listing.
      - name: Determine previous release
        id: prev-release
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | head -1 || true)
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      # Every board flashes some [<board>].variant, and it's the variant
      # -- not the board -- that has its own container image on ghcr.
      # Diff each *distinct* variant actually built this run, once,
      # rather than once per board (redundant whenever boards share a
      # variant, and the reason the old per-board "Publish release" step
      # above raced in the first place).
      - name: Determine variants
        id: variants
        env:
          # Passed via env, not spliced onto the python3 command line --
          # boards is a JSON array of double-quoted strings (e.g.
          # ["rock-5c"]), and embedding that directly inside this step's
          # own double-quoted "${{ ... }}" shell text lets bash's own
          # quote parsing eat the JSON's inner quotes before python ever
          # sees it (`"["rock-5c"]"` parses as quoted "[" + unquoted
          # rock-5c + quoted "]", handing python the invalid `[rock-5c]`).
          # env vars are set verbatim, with no such shell re-parsing.
          BOARDS_JSON: ${{ needs.discover.outputs.boards }}
        run: |
          set -euo pipefail
          variants=$(python3 - <<'PY'
          import json, os, tomllib
          boards = json.loads(os.environ["BOARDS_JSON"])
          with open("images/boards.toml", "rb") as f:
              data = tomllib.load(f)
          print(json.dumps(sorted({data[b]["variant"] for b in boards})))
          PY
          )
          echo "Built variants: ${variants}"
          echo "variants=${variants}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        if: github.event_name == 'workflow_run'
        env:
          PREV_TAG: ${{ steps.prev-release.outputs.prev_tag }}
          VARIANTS: ${{ steps.variants.outputs.variants }}
        run: |
          set -uo pipefail
          CURRENT_SHA=$(git rev-parse --short HEAD)
          MULTI=$(echo "${VARIANTS}" | jq 'length > 1')

          : > changelog.md
          for VARIANT in $(echo "${VARIANTS}" | jq -r '.[]'); do
            IMAGE_NAME="immutable-sbc-${VARIANT,,}"

            # Every build is also pushed under the permanent, per-commit
            # "latest-<gitsha>" tag (see Justfile's generate-build-tags) --
            # prefer that over the floating :latest so this diffs the exact
            # commits each release was built from. But build.yml's runs on
            # main share a concurrency group with cancel-in-progress: a
            # commit's per-commit tag only exists if its run wasn't
            # superseded by a later push before reaching the push step --
            # confirmed this actually happens (the commit the previous
            # release tag points to never got its own tag pushed, even
            # though the commit before it did). :latest is NOT a safe
            # fallback here like it is for NEW_IMAGE_REF below: by the
            # time this job runs, :latest already points at the *new*
            # release's commit, so using it for "previous" would silently
            # diff the new image against itself. Instead, walk backwards
            # from the previous release's own commit (inclusive, never
            # anything newer) until a commit is found whose per-commit tag
            # actually made it to ghcr.
            PREV_IMAGE_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:no-previous-release"
            if [[ -n "${PREV_TAG}" ]]; then
              while IFS= read -r CANDIDATE_SHA; do
                CANDIDATE_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-${CANDIDATE_SHA}"
                if podman pull --quiet "${CANDIDATE_REF}" >/dev/null 2>&1; then
                  PREV_IMAGE_REF="${CANDIDATE_REF}"
                  break
                fi
              done < <(git log --format='%h' "${PREV_TAG}")
            fi
            NEW_IMAGE_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-${CURRENT_SHA}"
            if ! podman pull --quiet "${NEW_IMAGE_REF}" >/dev/null 2>&1; then
              NEW_IMAGE_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
            fi

            if [[ "${MULTI}" == "true" ]]; then
              echo "# ${VARIANT}" >> changelog.md
              echo >> changelog.md
            fi

            # A changelog is a nicety, not a reason to block the release --
            # fall back to a placeholder rather than failing the job.
            VARIANT_CHANGELOG=$(mktemp)
            if ! ./scripts/generate-changelog.sh "${PREV_IMAGE_REF}" "${NEW_IMAGE_REF}" "${VARIANT_CHANGELOG}"; then
              echo "warning: changelog generation failed for ${VARIANT}, publishing without one" >&2
              printf '## Notes\n\nChangelog generation failed for this release -- see the commit history.\n' > "${VARIANT_CHANGELOG}"
            fi
            cat "${VARIANT_CHANGELOG}" >> changelog.md
            rm -f "${VARIANT_CHANGELOG}"
          done

      # Pushed only now, after the changelog above has already diffed
      # against history that doesn't include it yet -- relies on
      # actions/checkout's default persist-credentials plus this job's own
      # contents: write permission (same pattern as any other push in
      # this repo's workflows).
      - name: Create release tag
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          TAG="${{ steps.release-tag.outputs.tag }}"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Publish release
        if: github.event_name == 'workflow_run'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: ${{ steps.release-tag.outputs.tag }}
          body_path: changelog.md
          # bootc-image-builder-action's output-directory nests artifacts
          # by type (the raw image lands at <output-directory>/image/
          # disk.raw, not the directory root), and "Upload disk image and
          # checksum to Job Artifacts" above uploads that whole tree --
          # so the .zst/.sha256 this step needs land at
          # artifacts/image/... after download, not flat under artifacts/.
          # ** globs regardless of nesting depth; fail_on_unmatched_files
          # catches it loudly if that ever stops matching, instead of
          # silently publishing a release with no assets (confirmed: the
          # non-recursive artifacts/*.zst pattern this replaced did
          # exactly that).
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.zst
            artifacts/**/*.sha256
