name: Build container image
# Every non-PR run chains into release-meta (publishes) then build-flash.yml
# (via uses:, not a separate trigger).
on:
  pull_request:
  schedule:
    - cron: '0 10 1,15 * *'  # ~every 2 weeks: 10:00 UTC on the 1st and 15th, as a fallback for quiet periods with no pushes
  push:
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover variants
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.list.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Every top-level table in images/variants.toml IS a variant, no list to sync.
      # Adding one is just adding a table (plus its images/<suffix>/ dir).
      - name: List variants
        id: list
        run: |
          set -euo pipefail
          variants=$(python3 -c '
          import json, tomllib
          with open("images/variants.toml", "rb") as f:
              data = tomllib.load(f)
          print(json.dumps(sorted(v["suffix"] for v in data.values())))
          ')
          echo "Discovered variants: ${variants}"
          echo "variants=${variants}" >> "$GITHUB_OUTPUT"

  build_push:
    name: Build and push image (${{ matrix.variant }})
    needs: discover
    strategy:
      matrix:
        variant: ${{ fromJson(needs.discover.outputs.variants) }}
      fail-fast: false
    # aarch64-only project: the ROCK 5C is arm64, so this always runs on a
    # native arm64 runner (avoids QEMU emulation for the DKMS build step).
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # Actions pinned by SHA, kept current by Dependabot (.github/dependabot.yml).
      # fetch-depth: 0 + fetch-tags: needed to find the last release's commit below.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      # Package name is always "immutable-sbc-<variant>" -- image-template.env only holds
      # a single-variant default for a human running `just build` locally.
      - name: Image Name
        run: |
          echo "IMAGE_NAME=immutable-sbc-${{ matrix.variant }}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # Any push or manual dispatch on a branch other than default (pull_request and
      # schedule never land here: a PR's ref is a merge ref, not a branch head, and
      # schedule only ever runs on the default branch): push is still allowed (below),
      # but under a distinct testing-<branch> tag, never the real latest/dated tags --
      # and never creates a release or triggers build-flash (published marker stays
      # unset for this case, further down).
      - name: Compute test-branch mode
        id: test-mode
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" \
                && "${{ github.ref }}" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            # Not `echo | tr` -- echo's own trailing newline isn't alphanumeric either,
            # so tr -c converts it into a literal trailing '-' that survives $()'s
            # newline-stripping (it's not a newline by then). Confirmed on a real push:
            # tag came out "testing-collabora-kernel-". printf never adds that newline.
            BRANCH_SLUG=$(printf '%s' "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9' '-' | tr 'A-Z' 'a-z')
            echo "test_mode=true" >> "$GITHUB_OUTPUT"
            echo "DEFAULT_TAG=testing-${BRANCH_SLUG}" >> "$GITHUB_ENV"
          else
            echo "test_mode=false" >> "$GITHUB_OUTPUT"
          fi

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${{ matrix.variant }} \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Needed for the package-delta check below to pull images -- also gates everything
      # past this point (never on a PR or off the default branch).
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || steps.test-mode.outputs.test_mode == 'true')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Diffs against the last release's commit (not :latest, which can drift ahead) to
      # build the changelog and decide if a schedule run has anything new to publish.
      - name: Check package changes
        id: check-changes
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          NEW_IMAGE="${IMAGE_NAME}:${DEFAULT_TAG}"

          # Variant in filenames: download-artifact subdirs only on multiple matches.
          # /tmp not checkout: an untracked file broke the clean-tree check (e265edd).
          PKG_CHANGELOG="/tmp/package-changelog-${{ matrix.variant }}.md"
          PREV_SHA_FILE="/tmp/prev_sha-${{ matrix.variant }}.txt"

          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | head -1 || true)

          # Walk back for a commit with a real latest-<shortsha> tag --
          # cancel-in-progress can leave one never pushed (confirmed).
          PREV_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:no-previous-release"
          PREV_SHA=""
          if [[ -n "${PREV_TAG}" ]]; then
            while IFS= read -r CANDIDATE_SHA; do
              CANDIDATE_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-${CANDIDATE_SHA}"
              if podman pull --quiet "${CANDIDATE_REF}" >/dev/null 2>&1; then
                PREV_IMAGE="${CANDIDATE_REF}"
                PREV_SHA="${CANDIDATE_SHA}"
                break
              fi
            done < <(git log --format='%h' "${PREV_TAG}")
          fi

          ./scripts/diff-packages.sh "${PREV_IMAGE}" "${NEW_IMAGE}" "${PKG_CHANGELOG}"

          if grep -qx 'No package changes\.' "${PKG_CHANGELOG}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo -n "${PREV_SHA}" > "${PREV_SHA_FILE}"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.check-changes.outcome == 'success'
        with:
          name: changelog-${{ matrix.variant }}
          path: |
            /tmp/package-changelog-${{ matrix.variant }}.md
            /tmp/prev_sha-${{ matrix.variant }}.txt
          retention-days: 1

      # Rechunk/tag/push/sign matter only for a published image: never on a PR,
      # never a no-change schedule run (cron exists only to catch upstream updates).
      #
      # Optional, smaller delta updates -- chunkah instead of
      # `rpm-ostree compose build-chunked-oci`.
      - name: Rechunk with chunkah
        id: rechunk
        if: github.event_name != 'pull_request' && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        run: |
          just rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        if: github.event_name != 'pull_request' && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        if: github.event_name != 'pull_request' && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || steps.test-mode.outputs.test_mode == 'true') && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
          TEST_MODE: ${{ steps.test-mode.outputs.test_mode }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            # generate-build-tags also emits bare <date>/<date>-<sha> aliases meant for
            # the real default-branch pipeline -- a same-day test-branch push would
            # otherwise silently overwrite those. Only the testing-<branch>-prefixed
            # ones (DEFAULT_TAG was overridden to that above) are safe to push here.
            if [[ "${TEST_MODE}" == "true" && "${tag}" != testing-* ]]; then
              continue
            fi
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # Marks this variant as published this run -- release-meta/build-flash stay
      # skipped (via aggregate below) if no variant uploads one. Never for a test-branch
      # dispatch: that pushes a testing-<branch> image tag only, not a real release.
      - name: Upload published marker
        if: steps.push-image.outcome == 'success' && steps.test-mode.outputs.test_mode != 'true'
        run: touch published.marker

      - name: Upload published marker artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.push-image.outcome == 'success' && steps.test-mode.outputs.test_mode != 'true'
        with:
          name: published-${{ matrix.variant }}
          path: published.marker
          retention-days: 1

      # Image signing with cosign/sigstore. See README.md#image-signing for what to add
      # as the SIGNING_SECRET repo secret. Not skipped for a test-branch dispatch, even
      # though that image is a throwaway -- a deployed bootc system's policy requires a
      # valid signature on anything it pulls regardless of tag, confirmed the hard way:
      # `bootc switch` to an unsigned testing-* tag failed outright ("a signature was
      # required, but no signature exists").
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.push-image.outcome == 'success'
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: steps.push-image.outcome == 'success'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # Old bundle format so we can run cosign 3.X.X, not 2.X.X
          # (container-libs#388, rpm-ostree#5509).
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

  # Aggregates build_push's per-variant "published" signal -- a matrix job's own
  # outputs only reliably expose the last shard's value, so this checks markers.
  aggregate:
    name: Check publish status
    needs: [discover, build_push]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Download publish markers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: published-*
          path: publish-markers
          merge-multiple: true

      - name: Check publish status
        id: check
        run: |
          if [[ -n "$(ls -A publish-markers 2>/dev/null)" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # Publishes the release (tag + changelog) before build-flash.yml builds any disk
  # image -- the release is about the container image. Tag output feeds build-flash.
  #
  # Skipped when nothing published this run (aggregate above) -- build-flash
  # then skips too, since a job's needs must succeed, not just not-fail.
  release-meta:
    name: Publish release
    needs: [discover, build_push, aggregate]
    if: github.event_name != 'pull_request' && needs.aggregate.outputs.published == 'true'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}

    steps:
      # fetch-depth: 0 + fetch-tags -- release-tag/commit-range steps below need
      # full history and every v-tag to find the previous release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Tag = Fedora version (Containerfile's FROM line) + today's date.
      # A same-day repeat release gets .1, then .2, and so on.
      - name: Compute release tag
        id: release-tag
        run: |
          set -euo pipefail
          FEDORA_VER=$(awk -F'[:@]' '/^FROM quay.io\/fedora\/fedora-bootc:/ {print $2; exit}' Containerfile)
          if [[ -z "${FEDORA_VER}" ]]; then
            echo "error: couldn't read the Fedora version from Containerfile's fedora-bootc FROM line" >&2
            exit 1
          fi
          PREFIX="v${FEDORA_VER}.$(date -u +%Y%m%d)"
          if ! git rev-parse -q --verify "refs/tags/${PREFIX}" >/dev/null \
              && [[ -z "$(git tag -l "${PREFIX}.*")" ]]; then
            TAG="${PREFIX}"
          else
            # 10#: force base-10 so bash arithmetic below can't ever
            # misparse a counter value as an invalid octal literal.
            LAST_NUM=$(git tag -l "${PREFIX}.*" | sed -E "s/^${PREFIX}\.//" | sort -n | tail -1)
            NEXT_NUM=$(( 10#${LAST_NUM:-0} + 1 ))
            TAG="${PREFIX}.${NEXT_NUM}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Each variant's diff + prev-build sha, computed pre-push in build_push --
      # release-meta never pulls an image itself. Filenames carry the variant.
      - name: Download changelog artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: changelog-*
          path: changelog-artifacts
          merge-multiple: true

      # needs.discover.outputs.variants is already this run's exact list -- no
      # board->variant mapping needed, unlike when this lived in build-flash.yml.
      - name: Generate changelog
        env:
          VARIANTS: ${{ needs.discover.outputs.variants }}
        run: |
          set -euo pipefail
          MULTI=$(echo "${VARIANTS}" | jq 'length > 1')

          : > changelog.md
          for VARIANT in $(echo "${VARIANTS}" | jq -r '.[]'); do
            PKG_FILE="changelog-artifacts/package-changelog-${VARIANT,,}.md"
            SHA_FILE="changelog-artifacts/prev_sha-${VARIANT,,}.txt"

            if [[ "${MULTI}" == "true" ]]; then
              echo "# ${VARIANT}" >> changelog.md
              echo >> changelog.md
            fi

            # A changelog is a nicety, not a reason to block the release --
            # fall back to a placeholder if the artifact's missing.
            if [[ -f "${PKG_FILE}" ]]; then
              cat "${PKG_FILE}" >> changelog.md
            else
              echo "## Notes" >> changelog.md
              echo >> changelog.md
              echo "Changelog artifact missing for this variant -- see commit history." >> changelog.md
              echo >> changelog.md
            fi

            echo "## Commits" >> changelog.md
            echo >> changelog.md
            PREV_SHA=$(cat "${SHA_FILE}" 2>/dev/null || true)
            if [[ -n "${PREV_SHA}" ]] && git cat-file -e "${PREV_SHA}" 2>/dev/null; then
              git log --pretty='- %h %s' "${PREV_SHA}..HEAD" >> changelog.md
            else
              echo "(previous build's commit unavailable -- showing latest commit only)" >> changelog.md
              git log --pretty='- %h %s' -1 >> changelog.md
            fi
            echo >> changelog.md
          done

      # Pushed only now, after the changelog above has already diffed
      # against history that doesn't include it yet.
      - name: Create release tag
        run: |
          set -euo pipefail
          # Annotated tag needs a tagger identity; a fresh checkout never sets one
          # (confirmed: failed with "Committer identity unknown" without this).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.release-tag.outputs.tag }}"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      # No files: here on purpose -- build-flash.yml's attach-assets job uploads disk
      # images into this same release later (get-or-create, not a second release).
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: ${{ steps.release-tag.outputs.tag }}
          body_path: changelog.md

  # jobs.<id>.uses runs build-flash.yml as a real job in *this* run's
  # graph (same run page), not a separate triggered run.
  #
  # permissions: required -- a called workflow's jobs are capped by the *calling* job's
  # grant, not their own (confirmed: without this, write requests failed as read-only).
  build-flash:
    name: Build flash images
    needs: [discover, build_push, release-meta]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-flash.yml
    with:
      publish: true
      tag: ${{ needs.release-meta.outputs.tag }}
    permissions:
      contents: write
