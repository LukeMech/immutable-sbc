name: Build container image
# Every successful non-PR run here (push, schedule, or workflow_dispatch)
# automatically chains into build-flash.yml via the "build-flash" job
# below, which builds the flash images and publishes a release. Declared
# here (this workflow calls that one as a reusable workflow), not the
# other way around -- build-flash.yml itself never declares a trigger on
# this file, so it never runs on its own just because this one did.
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 10 1,15 * *'  # ~every 2 weeks: 10:00 UTC on the 1st and 15th, as a fallback for quiet periods with no pushes
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover variants
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.list.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Every top-level table in images/variants.toml IS a variant -- no
      # separate list to keep in sync. Adding a variant is just adding
      # a table there (plus its images/<suffix>/ directory).
      - name: List variants
        id: list
        run: |
          set -euo pipefail
          variants=$(python3 -c '
          import json, tomllib
          with open("images/variants.toml", "rb") as f:
              data = tomllib.load(f)
          print(json.dumps(sorted(v["suffix"] for v in data.values())))
          ')
          echo "Discovered variants: ${variants}"
          echo "variants=${variants}" >> "$GITHUB_OUTPUT"

  build_push:
    name: Build and push image (${{ matrix.variant }})
    needs: discover
    strategy:
      matrix:
        variant: ${{ fromJson(needs.discover.outputs.variants) }}
      fail-fast: false
    # aarch64-only project: the ROCK 5C is arm64, so this always runs on a
    # native arm64 runner (avoids QEMU emulation for the DKMS build step).
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These action versions are pinned by commit SHA and kept current by
      # Dependabot (.github/dependabot.yml, github-actions ecosystem).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      # Package name is always "immutable-sbc-<variant>" -- never derived
      # from image-template.env here, since that only ever holds a
      # single-variant default for a human running `just build` locally.
      - name: Image Name
        run: |
          echo "IMAGE_NAME=immutable-sbc-${{ matrix.variant }}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${{ matrix.variant }} \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Rechunking, tag generation, and tagging only matter for an image
      # that's actually going to be pushed -- a pull_request build never
      # is (see the Login/Push/Sign steps below, already gated the same
      # way), so skip all three there rather than pay for them on every
      # PR just to throw the result away.
      #
      # This is optional, this provides smaller delta updates.
      # chunkah instead of `rpm-ostree compose build-chunked-oci`
      - name: Rechunk with chunkah
        id: rechunk
        if: github.event_name != 'pull_request'
        run: |
          just rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        if: github.event_name != 'pull_request'
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        if: github.event_name != 'pull_request'
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # Image signing with cosign/sigstore. See README.md#image-signing for
      # what to add as the SIGNING_SECRET repo secret.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

  # Runs once, after every variant in the matrix above has finished (not
  # per-variant -- build-flash.yml matrixes over boards on its own and
  # only needs to run once regardless of how many variants exist here).
  # A real needs:-gated job in this same run's graph, not a separate
  # triggered run elsewhere: build-flash.yml executes as part of *this*
  # workflow run (same run page, same concurrency-visible unit), which is
  # what jobs.<id>.uses (a reusable workflow call) gets you that firing
  # off a separate run via the API never would. No permissions: block
  # needed here -- build-flash.yml's own jobs already declare exactly
  # what they need (contents: write for its release job, contents: read
  # for its build job), and those apply as-is unless a caller explicitly
  # narrows them.
  build-flash:
    name: Build flash images
    needs: [discover, build_push]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-flash.yml
