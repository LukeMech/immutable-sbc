name: Build container image
# Every successful non-PR run here chains into release-meta (publishes
# the release) then build-flash.yml (uses:, not a separate trigger --
# that file never triggers on this one).
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 10 1,15 * *'  # ~every 2 weeks: 10:00 UTC on the 1st and 15th, as a fallback for quiet periods with no pushes
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover variants
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.list.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Every top-level table in images/variants.toml IS a variant -- no
      # separate list to keep in sync. Adding a variant is just adding
      # a table there (plus its images/<suffix>/ directory).
      - name: List variants
        id: list
        run: |
          set -euo pipefail
          variants=$(python3 -c '
          import json, tomllib
          with open("images/variants.toml", "rb") as f:
              data = tomllib.load(f)
          print(json.dumps(sorted(v["suffix"] for v in data.values())))
          ')
          echo "Discovered variants: ${variants}"
          echo "variants=${variants}" >> "$GITHUB_OUTPUT"

  build_push:
    name: Build and push image (${{ matrix.variant }})
    needs: discover
    strategy:
      matrix:
        variant: ${{ fromJson(needs.discover.outputs.variants) }}
      fail-fast: false
    # aarch64-only project: the ROCK 5C is arm64, so this always runs on a
    # native arm64 runner (avoids QEMU emulation for the DKMS build step).
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These action versions are pinned by commit SHA and kept current by
      # Dependabot (.github/dependabot.yml, github-actions ecosystem).
      # fetch-depth: 0 + fetch-tags -- "Check package changes" below needs
      # full history and every v-tag to find the last actual release's
      # commit (not just whatever :latest currently points to).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      # Package name is always "immutable-sbc-<variant>" -- never derived
      # from image-template.env here, since that only ever holds a
      # single-variant default for a human running `just build` locally.
      - name: Image Name
        run: |
          echo "IMAGE_NAME=immutable-sbc-${{ matrix.variant }}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${{ matrix.variant }} \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Needed before the package-delta check below can pull the
      # currently-published :latest to diff against (this project's
      # packages happen to be public, but logging in here costs nothing
      # and matches what pushing/signing further down need anyway).
      # Never on a PR or a non-default-branch ref -- nothing past this
      # point runs there either.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Diffs against the last actual *release*'s commit -- not :latest,
      # which can drift ahead of it (a run can push and move :latest
      # before its own release-meta job runs or completes). Every
      # successful push also tags its own commit permanently
      # (latest-<shortsha>, Justfile's generate-build-tags), so the last
      # release tag's commit resolves to a real, stable image ref.
      #
      # Used both to build this variant's package-changelog section, and
      # to decide below whether a schedule-triggered run (the biweekly
      # cron fallback) actually found anything new. push/workflow_dispatch
      # never skip on this -- those are always a deliberate rebuild,
      # published regardless of whether package versions moved.
      - name: Check package changes
        id: check-changes
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          NEW_IMAGE="${IMAGE_NAME}:${DEFAULT_TAG}"

          # Variant baked into the filenames themselves, not just the
          # artifact name -- download-artifact only creates a per-artifact
          # subdirectory when a `pattern` matches *multiple* artifacts; with
          # today's single variant it always matches exactly one and
          # extracts flat instead (confirmed: release-meta's lookup at a
          # "changelog-<variant>/" subdirectory came up empty on a real
          # run). Filenames make the download layout independent of how
          # many variants ever exist.
          PKG_CHANGELOG="package-changelog-${{ matrix.variant }}.md"
          PREV_SHA_FILE="prev_sha-${{ matrix.variant }}.txt"

          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | head -1 || true)

          # Walk backward commit-by-commit from the last release's tag
          # until one with a real latest-<shortsha> tag is found --
          # cancel-in-progress can leave a commit's own tag never pushed
          # if that run got cancelled before reaching the Push step
          # (confirmed happens).
          PREV_IMAGE="${IMAGE_REGISTRY}/${IMAGE_NAME}:no-previous-release"
          PREV_SHA=""
          if [[ -n "${PREV_TAG}" ]]; then
            while IFS= read -r CANDIDATE_SHA; do
              CANDIDATE_REF="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-${CANDIDATE_SHA}"
              if podman pull --quiet "${CANDIDATE_REF}" >/dev/null 2>&1; then
                PREV_IMAGE="${CANDIDATE_REF}"
                PREV_SHA="${CANDIDATE_SHA}"
                break
              fi
            done < <(git log --format='%h' "${PREV_TAG}")
          fi

          ./scripts/diff-packages.sh "${PREV_IMAGE}" "${NEW_IMAGE}" "${PKG_CHANGELOG}"

          if grep -qx 'No package changes\.' "${PKG_CHANGELOG}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo -n "${PREV_SHA}" > "${PREV_SHA_FILE}"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.check-changes.outcome == 'success'
        with:
          name: changelog-${{ matrix.variant }}
          path: |
            package-changelog-${{ matrix.variant }}.md
            prev_sha-${{ matrix.variant }}.txt
          retention-days: 1

      # Rechunking, tag generation, tagging, pushing and signing only
      # matter for an image that's actually going to be published:
      # - never on a PR (see Login above, gated the same way)
      # - never on a schedule run that found no package changes -- the
      #   biweekly cron (line 10) exists only to catch upstream updates
      #   during quiet periods, so if dnf5 pulled in nothing new since
      #   :latest, there's nothing to publish.
      #
      # This is optional, this provides smaller delta updates.
      # chunkah instead of `rpm-ostree compose build-chunked-oci`
      - name: Rechunk with chunkah
        id: rechunk
        if: github.event_name != 'pull_request' && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        run: |
          just rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        if: github.event_name != 'pull_request' && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        if: github.event_name != 'pull_request' && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !(github.event_name == 'schedule' && steps.check-changes.outputs.changed == 'false')
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # Marks this variant as actually published this run -- release-meta
      # and build-flash both stay skipped (via the aggregate job below)
      # when no variant uploads one, e.g. every variant's schedule run
      # found no package changes.
      - name: Upload published marker
        if: steps.push-image.outcome == 'success'
        run: touch published.marker

      - name: Upload published marker artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.push-image.outcome == 'success'
        with:
          name: published-${{ matrix.variant }}
          path: published.marker
          retention-days: 1

      # Image signing with cosign/sigstore. See README.md#image-signing for
      # what to add as the SIGNING_SECRET repo secret.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.push-image.outcome == 'success'
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: steps.push-image.outcome == 'success'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

  # Bridges build_push's per-variant "did it actually publish" signal
  # across the matrix -- a matrix job's own `outputs` only reliably
  # exposes its *last* completed shard's value, not a real aggregate, so
  # this checks for the marker artifact instead. Today there's only ever
  # one variant, but this stays correct if a second one is ever added.
  aggregate:
    name: Check publish status
    needs: [discover, build_push]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Download publish markers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: published-*
          path: publish-markers
          merge-multiple: true

      - name: Check publish status
        id: check
        run: |
          if [[ -n "$(ls -A publish-markers 2>/dev/null)" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # Publishes the release (tag + changelog) as soon as the container
  # image is live on ghcr, before build-flash.yml even starts building
  # any disk image -- the release is about the container image (what
  # `bootc upgrade` pulls), not the much-slower flash images. Its tag
  # output feeds the build-flash job below.
  #
  # Skipped entirely when nothing was published this run (see aggregate
  # above) -- build-flash then also skips automatically, since a job's
  # needs must have succeeded, not been skipped, by default.
  release-meta:
    name: Publish release
    needs: [discover, build_push, aggregate]
    if: github.event_name != 'pull_request' && needs.aggregate.outputs.published == 'true'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}

    steps:
      # fetch-depth: 0 + fetch-tags -- the release-tag/commit-range steps
      # below need full history and every v-tag to find the previous
      # release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Tag = Fedora version (Containerfile's own FROM line) + today's
      # date. First release of the day gets the bare tag; a second one
      # the same day gets .1, then .2, and so on.
      - name: Compute release tag
        id: release-tag
        run: |
          set -euo pipefail
          FEDORA_VER=$(awk -F'[:@]' '/^FROM quay.io\/fedora\/fedora-bootc:/ {print $2; exit}' Containerfile)
          if [[ -z "${FEDORA_VER}" ]]; then
            echo "error: couldn't read the Fedora version from Containerfile's fedora-bootc FROM line" >&2
            exit 1
          fi
          PREFIX="v${FEDORA_VER}.$(date -u +%Y%m%d)"
          if ! git rev-parse -q --verify "refs/tags/${PREFIX}" >/dev/null \
              && [[ -z "$(git tag -l "${PREFIX}.*")" ]]; then
            TAG="${PREFIX}"
          else
            # 10#: force base-10 so bash arithmetic below can't ever
            # misparse a counter value as an invalid octal literal.
            LAST_NUM=$(git tag -l "${PREFIX}.*" | sed -E "s/^${PREFIX}\.//" | sort -n | tail -1)
            NEXT_NUM=$(( 10#${LAST_NUM:-0} + 1 ))
            TAG="${PREFIX}.${NEXT_NUM}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # One changelog-<variant> artifact per variant, each holding the
      # package-diff build_push already computed pre-push (see "Check
      # package changes" above) plus that variant's previous-build git
      # sha -- release-meta itself never pulls an image.
      # merge-multiple -- flat layout regardless of how many artifacts
      # match, since download-artifact only creates a per-artifact
      # subdirectory when a `pattern` matches more than one (confirmed:
      # with today's single variant it always matches exactly one and
      # extracts flat instead). build_push already bakes the variant into
      # the filenames themselves (package-changelog-<variant>.md,
      # prev_sha-<variant>.txt), so a flat layout is unambiguous either
      # way.
      - name: Download changelog artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: changelog-*
          path: changelog-artifacts
          merge-multiple: true

      # needs.discover.outputs.variants is already the exact list built
      # this run -- no board->variant mapping needed, unlike when this
      # logic lived in build-flash.yml.
      - name: Generate changelog
        env:
          VARIANTS: ${{ needs.discover.outputs.variants }}
        run: |
          set -euo pipefail
          MULTI=$(echo "${VARIANTS}" | jq 'length > 1')

          : > changelog.md
          for VARIANT in $(echo "${VARIANTS}" | jq -r '.[]'); do
            PKG_FILE="changelog-artifacts/package-changelog-${VARIANT,,}.md"
            SHA_FILE="changelog-artifacts/prev_sha-${VARIANT,,}.txt"

            if [[ "${MULTI}" == "true" ]]; then
              echo "# ${VARIANT}" >> changelog.md
              echo >> changelog.md
            fi

            # A changelog is a nicety, not a reason to block the release --
            # fall back to a placeholder if build_push's artifact is
            # somehow missing, rather than failing the job.
            if [[ -f "${PKG_FILE}" ]]; then
              cat "${PKG_FILE}" >> changelog.md
            else
              echo "## Notes" >> changelog.md
              echo >> changelog.md
              echo "Changelog artifact missing for this variant -- see commit history." >> changelog.md
              echo >> changelog.md
            fi

            echo "## Commits" >> changelog.md
            echo >> changelog.md
            PREV_SHA=$(cat "${SHA_FILE}" 2>/dev/null || true)
            if [[ -n "${PREV_SHA}" ]] && git cat-file -e "${PREV_SHA}" 2>/dev/null; then
              git log --pretty='- %h %s' "${PREV_SHA}..HEAD" >> changelog.md
            else
              echo "(previous build's commit unavailable -- showing latest commit only)" >> changelog.md
              git log --pretty='- %h %s' -1 >> changelog.md
            fi
            echo >> changelog.md
          done

      # Pushed only now, after the changelog above has already diffed
      # against history that doesn't include it yet.
      - name: Create release tag
        run: |
          set -euo pipefail
          # Annotated tag needs a tagger identity; a fresh checkout never
          # configures one (confirmed: failed with "Committer identity
          # unknown" without this).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.release-tag.outputs.tag }}"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      # No files: here on purpose -- build-flash.yml's attach-assets job
      # uploads disk images into this same release afterward (get-or-
      # create finds it rather than making a second one).
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: ${{ steps.release-tag.outputs.tag }}
          body_path: changelog.md

  # jobs.<id>.uses runs build-flash.yml as a real job in *this* run's
  # graph (same run page), not a separate triggered run.
  #
  # permissions: is required here -- a called workflow's nested jobs are
  # capped by what the *calling* job grants, not its own per-job
  # permissions. Without this, GitHub fell back to the repo default
  # (read) and failed: "The nested job 'release' is requesting
  # 'contents: write', but is only allowed 'contents: read'."
  build-flash:
    name: Build flash images
    needs: [discover, build_push, release-meta]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-flash.yml
    with:
      publish: true
      tag: ${{ needs.release-meta.outputs.tag }}
    permissions:
      contents: write
