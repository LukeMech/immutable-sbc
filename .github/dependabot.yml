# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# github-actions: keeps every `uses:` commit-SHA pin in .github/workflows
# up to date.
# docker: keeps every `FROM ...@sha256:...` digest in Containerfile up
# to date -- including its unused `chunkah-pin` stage, which exists
# purely so this covers the chunkah image version too (the Justfile's
# `rechunk` recipe reads that FROM line back out at runtime).

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
