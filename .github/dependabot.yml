# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# github-actions: keeps every `uses:` commit-SHA pin up to date.
# docker: no digest pin exists yet (Containerfile/Justfile use floating
# tags on purpose) -- kept configured for whenever one is added.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
